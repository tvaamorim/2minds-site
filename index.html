<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<title>2Minds</title>
	<link rel="shortcut icon" href="./favicon.ico" />
	<link href='http://fonts.googleapis.com/css?family=Lato:300,400' rel='stylesheet' type='text/css' />
	<link href="Css/Main.css" rel="stylesheet" />	
	<script src="Scripts/jquery-2.0.3.min.js"></script>
	<script src="Scripts/jquery.touchSwipe.min.js"></script>
	<script src="Scripts/jquery.carouFredSel-6.2.1.min.js"></script>
	<script src="Scripts/main.js"></script>
</head>
<body>
	<header>
		<a href="mailto:contact@2minds.it">contact@2minds.it</a>
	</header>

	<section class="content">
		<div class="row-1-wrapper">
			<div class="row-1">
				<div class="logo-panel">
					<div class="logo-wrapper">
						<div class="logo">
							<img src="Images/Logo.png" class="logo-img" title="2Minds" alt="2Minds" />

						</div>
					</div>
				</div>
				<div class="phone-table-wrapper">
					<div class="phone-table-left-corner">
					</div>
					<div class="phone-table">
						<div class="phone-wrapper">
							<div class="phone-cell">
								<img src="Images/Mobile-Phones.png" class="phone" />
								<img src="Images/White-Screen-1.png" class="white-screen phone" id="white-screen-1" />
								<img src="Images/White-Screen-2.png" class="white-screen phone" id="white-screen-2" />
								<img src="Images/White-Screen-3.png" class="white-screen phone" id="white-screen-3" />
								<img src="Images/White-Screen-4.png" class="white-screen phone" id="white-screen-4" />
								<div class="white-screen-1-hover-area"></div>
								<div class="white-screen-2-hover-area"></div>
								<div class="white-screen-3-hover-area"></div>
								<div class="white-screen-4-hover-area"></div>
							</div>
						</div>
					</div>
					<div class="phone-table-right-corner">
					</div>
				</div>
			</div>

		</div>
		<div class="row-2-wrapper">
			<div class="row-2">
				<div class="value-wrapper">
					<div class="value">
						<ul id="values-carousel" class="values-carousel">
							<li>honesty above all</li>
							<li>keep our independent roots</li>
							<li>good is not enough</li>
							<li>make it fun</li>
						</ul>
					</div>
				</div>
			</div>
		</div>

		<div class="row-3-wrapper">
			<div class="row-3">
				<div class="left-panel">
					<div class="quote-wrapper">
						<div class="quote">
							<img class="quote-img" src="Images/Quote.png" title="Why?" alt="Why?" />
						</div>
					</div>
				</div>
				<div class="right-panel">
					<div class="about-wrapper">
						<div class="about">
							<span class="text-highlight">2Minds development</span> is a company created by two friends based in Brasilia, Brazil. We are specialized in creating mobile experiences (sometimes they call it apps).
						</div>
					</div>
				</div>
			</div>
		</div>

	</section>

	<footer>
	</footer>
	
	<script>
		(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		})(window,document,'script','//www.google-analytics.com/analytics.js','ga');

		ga('create', 'UA-44610359-1', '2minds.it');
		ga('send', 'pageview');
	</script>

</body>
</html>
