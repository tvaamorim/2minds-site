<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moustache: Jogo do Impostor</title>
<meta name="description" content="Todo mundo sabe a palavra. Menos um. Baixe o Moustache na App Store ou no Google Play.">
<meta property="og:title" content="Moustache: Jogo do Impostor">
<meta property="og:description" content="Todo mundo sabe a palavra. Menos um.">
<meta property="og:image" content="https://2minds.it/moustache/icone.png">
<link rel="icon" href="../icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<script>
  // Fill APP_STORE_ID once the app exists in App Store Connect; until then iPhones see this page.
  var APP_STORE_ID = '';
  var PLAY_ID = 'it.twominds.impostormoustache';
  var src = new URLSearchParams(location.search).get('ct') || 'site';
  var ios = 'https://apps.apple.com/app/id' + APP_STORE_ID;
  var play = 'https://play.google.com/store/apps/details?id=' + PLAY_ID +
    '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=share');
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (isIOS && APP_STORE_ID) location.replace(ios);
  else if (/Android/.test(ua)) location.replace(play);
</script>
<style>
  :root { --amarelo: #ffd23f; --tinta: #1b1b1b; --azul: #3a86ff; --verde: #06d6a0; --papel: #fffdf5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: Nunito, system-ui, sans-serif; color: var(--tinta);
    background: var(--amarelo) radial-gradient(rgba(27,27,27,.13) 1.2px, transparent 1.4px) 0 0 / 10px 10px;
  }
  main {
    width: 100%; max-width: 420px; text-align: center; background: var(--papel);
    border: 4px solid var(--tinta); border-radius: 20px; box-shadow: 8px 8px 0 var(--tinta); padding: 28px 22px;
  }
  img { width: 128px; height: 128px; border-radius: 28px; border: 4px solid var(--tinta); }
  h1 { font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 40px; margin: 14px 0 2px; letter-spacing: .5px; }
  .sub { font-weight: 800; font-size: 18px; margin: 0 0 22px; }
  a.btn {
    display: block; margin: 12px 0; padding: 14px; border: 4px solid var(--tinta); border-radius: 14px;
    box-shadow: 4px 4px 0 var(--tinta); font-family: 'Lilita One', sans-serif; font-size: 22px;
    color: #fff; text-decoration: none;
  }
  a.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--tinta); }
  .ios { background: var(--azul); }
  .android { background: var(--verde); color: var(--tinta) !important; }
  .soon { opacity: .55; pointer-events: none; }
  small { display: block; margin-top: 18px; font-size: 13px; }
  small a { color: inherit; }
</style>
</head>
<body>
<main>
  <img src="../icone.png" alt="">
  <h1>Moustache</h1>
  <p class="sub" id="sub">Todo mundo sabe a palavra. Menos um.</p>
  <a class="btn ios" id="ios" href="#">App Store</a>
  <a class="btn android" id="android" href="#">Google Play</a>
  <small><a href="../suporte/">Suporte</a> · <a href="../privacidade/">Privacidade</a> · <a href="../termos/">Termos</a> · <a href="https://2minds.it">2Minds</a></small>
</main>
<script>
  var t = {
    pt: ['Todo mundo sabe a palavra. Menos um.', 'App Store (em breve)'],
    es: ['Todos saben la palabra. Menos uno.', 'App Store (muy pronto)'],
    en: ['Everyone knows the word. Except one.', 'App Store (coming soon)']
  }[(navigator.language || 'pt').slice(0, 2)] || null;
  t = t || ['Everyone knows the word. Except one.', 'App Store (coming soon)'];
  document.getElementById('sub').textContent = t[0];
  var a = document.getElementById('ios');
  if (APP_STORE_ID) a.href = ios; else { a.textContent = t[1]; a.classList.add('soon'); }
  document.getElementById('android').href = play;
</script>
</body>
</html>
